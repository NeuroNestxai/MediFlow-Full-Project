org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend base URL baked into BuildConfig.API_BASE_URL of both apps.
# 10.0.2.2 is the host machine as seen from the Android emulator. Override per machine in
# ~/.gradle/gradle.properties or with -Pqabnah.apiBaseUrl=https://... (release builds must use https).
qabnah.apiBaseUrl=http://10.0.2.2:4000/v1
