<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Bouquet illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#831843"/><stop offset="0.55" stop-color="#BE185D"/><stop offset="1" stop-color="#F9A8D4"/></linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5"><stop offset="0" stop-color="#FFF1F2" stop-opacity="0.5"/><stop offset="1" stop-color="#FFF1F2" stop-opacity="0"/></radialGradient>
    <g id="rose"><circle r="34" fill="#E11D48"/><path d="M-20-6c6-20 34-22 40-4-10-10-28-10-40 4z" fill="#9F1239"/><path d="M-24 8c10 18 40 18 48 0-14 8-34 8-48 0z" fill="#9F1239"/><circle r="12" fill="#BE123C"/><path d="M-6-4c4-8 14-8 16 0" stroke="#881337" stroke-width="3" fill="none"/></g>
    <g id="bloom"><g fill="#FBCFE8"><ellipse cx="0" cy="-22" rx="14" ry="22"/><ellipse cx="0" cy="22" rx="14" ry="22"/><ellipse cx="-22" cy="0" rx="22" ry="14"/><ellipse cx="22" cy="0" rx="22" ry="14"/></g><circle r="11" fill="#F59E0B"/></g>
    <pattern id="petals" width="90" height="90" patternUnits="userSpaceOnUse"><ellipse cx="20" cy="20" rx="8" ry="4" fill="#FFF1F2" opacity="0.14" transform="rotate(30 20 20)"/><ellipse cx="65" cy="60" rx="7" ry="3.5" fill="#FFF1F2" opacity="0.1" transform="rotate(-20 65 60)"/></pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#petals)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
  <!-- stems -->
  <g stroke="#166534" stroke-width="8" stroke-linecap="round" fill="none"><path d="M900 380L840 170"/><path d="M905 380L930 140"/><path d="M910 380L1010 180"/><path d="M898 380L780 210"/><path d="M908 380L1060 240"/></g>
  <g fill="#16A34A"><path d="M860 270c-40-10-56-40-56-40s40 0 56 40z"/><path d="M950 260c40-14 60-44 60-44s-44 2-60 44z"/><path d="M900 310c-30 0-50-24-50-24s34-6 50 24z"/></g>
  <!-- wrap -->
  <path d="M790 260h230l-80 140h-70z" fill="#FFF1F2"/><path d="M790 260l115 50 115-50" fill="none" stroke="#FBCFE8" stroke-width="6"/>
  <path d="M870 330h70l-10 22h-50z" fill="#F59E0B"/>
  <!-- flowers -->
  <use href="#rose" x="840" y="165"/><use href="#rose" x="932" y="130"/><use href="#rose" x="1012" y="176"/>
  <use href="#bloom" x="778" y="210"/><use href="#bloom" x="1062" y="236"/>
  <circle cx="885" cy="210" r="14" fill="#FDF2F8"/><circle cx="975" cy="214" r="12" fill="#FDF2F8"/><circle cx="930" cy="190" r="10" fill="#FDF2F8"/>
  <!-- falling petals -->
  <g fill="#FFE4E6" opacity="0.8"><ellipse cx="660" cy="120" rx="12" ry="6" transform="rotate(30 660 120)"/><ellipse cx="700" cy="300" rx="10" ry="5" transform="rotate(-40 700 300)"/><ellipse cx="1140" cy="90" rx="12" ry="6" transform="rotate(60 1140 90)"/><ellipse cx="1150" cy="330" rx="10" ry="5" transform="rotate(10 1150 330)"/></g>
</svg>
