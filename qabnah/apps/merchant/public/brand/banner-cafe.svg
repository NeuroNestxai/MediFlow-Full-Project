  <g fill="#7C2D12"><ellipse cx="672" cy="284" rx="18" ry="11"/><ellipse cx="704" cy="278" rx="18" ry="11"/><ellipse cx="738" cy="282" rx="18" ry="11"/><ellipse cx="764" cy="288" rx="16" ry="10"/><ellipse cx="690" cy="268" rx="16" ry="10"/><ellipse cx="724" cy="264" rx="16" ry="10"/></g>
