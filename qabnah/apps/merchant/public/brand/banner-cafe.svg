    <path d="M1010 268h70l-8 44h-54z" fill="#FFF7ED"/><path d="M1010 268h70" stroke="#F4A300" stroke-width="5"/>
    <path d="M1090 280h60l-7 36h-46z" fill="#FFF7ED"/><path d="M1090 280h60" stroke="#F4A300" stroke-width="5"/>
