    <path d="M44 130c-44 0-60 40-40 80" fill="none" stroke="#B7791F" stroke-width="14" stroke-linecap="round"/>
    <path d="M58 120h86M54 170h92" stroke="#8D5A12" stroke-width="4" opacity="0.6"/>
  </g>
