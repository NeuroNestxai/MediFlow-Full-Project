<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Omani coffee illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B1A17"/><stop offset="0.6" stop-color="#4B2E2A"/><stop offset="1" stop-color="#7C4A32"/></linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.5" r="0.55"><stop offset="0" stop-color="#F4A300" stop-opacity="0.45"/><stop offset="1" stop-color="#F4A300" stop-opacity="0"/></radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B7791F"/><stop offset="0.5" stop-color="#F6C453"/><stop offset="1" stop-color="#B7791F"/></linearGradient>
    <pattern id="geo" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M30 0L60 30 30 60 0 30z" fill="none" stroke="#F4A300" stroke-opacity="0.12" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#geo)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
