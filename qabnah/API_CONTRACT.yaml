      responses: { '200': { description: OK } }
  /admin/analytics/overview:
    get:
      tags: [Admin]
      summary: Platform KPIs (analytics:read)
      parameters: [{ name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Analytics' } } } } }
  /admin/finance/balances:
    get:
      tags: [Admin]
      summary: Unsettled balances per merchant/captain and platform revenue (finance:read)
      parameters: [{ name: accountType, in: query, schema: { type: string, enum: [merchant, captain] } }]
      responses: { '200': { description: OK } }
  /admin/settlements:
    get:
      tags: [Admin]
      summary: Settlements (finance:read)
      parameters: [{ name: status, in: query, schema: { type: string } }, { name: accountType, in: query, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /admin/settlements/generate:
    post:
      tags: [Admin]
      summary: Generate draft settlements for all accounts with unsettled entries up to periodEnd (settlements:manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountType, periodStart, periodEnd]
              properties:
                accountType: { type: string, enum: [merchant, captain] }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
      responses: { '201': { description: Created drafts } }
  /admin/settlements/{id}/{action}:
    parameters: [{ $ref: '#/components/parameters/id' }, { name: action, in: path, required: true, schema: { type: string, enum: [approve, mark-paid, cancel] } }]
    post:
      tags: [Admin]
      summary: approve (settlements:approve, not by creator), mark-paid (settlements:manage, needs payoutReference), cancel (settlements:manage)
      requestBody: { content: { application/json: { schema: { type: object, properties: { payoutReference: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /admin/captains/{id}/cod-remittance:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Admin]
      summary: Record cash remitted by a captain (settlements:manage)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amountBaisa], properties: { amountBaisa: { type: integer }, note: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /admin/users:
    get:
      tags: [Admin]
      summary: Users (users:read)
      parameters: [{ name: q, in: query, schema: { type: string } }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/offset' }]
      responses: { '200': { description: OK } }
  /admin/users/{id}/status:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Admin]
      summary: Suspend / reactivate a user (users:manage)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [active, suspended] } } } } } }
      responses: { '200': { description: OK } }
  /admin/users/{id}/mfa-reset:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Admin]
      summary: Reset another user's two-factor authentication (staff:manage; audited; revokes their sessions)
      responses: { '200': { description: OK } }
  /admin/roles:
    get:
      tags: [Admin]
      summary: Roles with permissions
      responses: { '200': { description: OK } }
  /admin/staff:
    get:
      tags: [Admin]
      summary: Platform staff with roles (staff:manage)
      responses: { '200': { description: OK } }
    post:
      tags: [Admin]
      summary: Create platform staff user (temporary password returned once) (staff:manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName, roleKeys]
              properties:
                email: { type: string }
                fullName: { type: string }
                roleKeys: { type: array, items: { type: string } }
      responses: { '201': { description: Created } }
  /admin/staff/{userId}/roles:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
    put:
      tags: [Admin]
      summary: Replace platform roles of a staff user (staff:manage; cannot remove own super_admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [roleKeys], properties: { roleKeys: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: OK } }
  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Audit log (audit:read)
      parameters: [{ name: entityType, in: query, schema: { type: string } }, { name: entityId, in: query, schema: { type: string } }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/offset' }]
      responses: { '200': { description: OK } }

  # ─────────────── Webhooks ───────────────
  /webhooks/payments/{provider}:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [thawani, mock] } }]
    post:
      tags: [Webhooks]
      security: []
      summary: Payment gateway callback. Verified per provider; processed idempotently. The payment status is re-fetched from the provider before applying.
      responses: { '200': { description: Accepted }, '401': { description: Signature invalid } }
  /webhooks/whatsapp:
    get:
      tags: [Webhooks]
      security: []
      summary: Meta webhook verification (hub.mode, hub.verify_token, hub.challenge)
      responses: { '200': { description: Challenge echoed }, '403': { description: Bad token } }
    post:
      tags: [Webhooks]
      security: []
      summary: WhatsApp Cloud API events (messages, statuses). Verified with X-Hub-Signature-256.
      responses: { '200': { description: Accepted }, '401': { description: Signature invalid } }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    merchantId: { name: merchantId, in: path, required: true, schema: { type: string, format: uuid } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    idempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 100 } }
  requestBodies:
    Review:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [approved, rejected] }
              reason: { type: string }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, details: {} }
    LatLng:
      type: object
      required: [lat, lng]
      properties: { lat: { type: number, minimum: -90, maximum: 90 }, lng: { type: number, minimum: -180, maximum: 180 } }
    PlaceInput:
      type: object
      required: [location]
      properties:
        location: { $ref: '#/components/schemas/LatLng' }
        addressId: { type: string, format: uuid, description: Use a saved address instead of location }
        address: { type: string }
        contactName: { type: string }
        contactPhone: { type: string }
        notes: { type: string }
    Place:
      type: object
      properties:
        location: { $ref: '#/components/schemas/LatLng' }
        address: { type: string }
        contactName: { type: [string, 'null'] }
        contactPhone: { type: [string, 'null'], description: Masked or hidden depending on viewer and delivery state }
        notes: { type: [string, 'null'] }
    OrderType: { type: string, enum: [marketplace, merchant_delivery, c2c] }
    VehicleType: { type: string, enum: [bike, car, van] }
    MerchantCategory: { type: string, enum: [restaurant, cafe, grocery, pharmacy, retail, flowers, electronics, other] }
    OrderStatus: { type: string, enum: [pending_payment, placed, accepted, preparing, ready_for_pickup, out_for_delivery, delivered, completed, rejected, cancelled] }
    DeliveryStatus: { type: string, enum: [created, searching, unassigned, assigned, at_pickup, picked_up, at_dropoff, delivered, failed, returning, returned, cancelled] }
    CaptainDocType: { type: string, enum: [national_id, driving_license, vehicle_registration, vehicle_insurance, profile_photo, police_clearance] }
    Tokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access token lifetime in seconds }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        fullName: { type: string }
        locale: { type: string, enum: [ar, en] }
        status: { type: string }
    AuthResult:
      allOf:
        - { $ref: '#/components/schemas/Tokens' }
        - type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            isNewUser: { type: boolean }
    Me:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        roles: { type: array, items: { type: object, properties: { key: { type: string }, merchantId: { type: [string, 'null'] } } } }
        permissions: { type: array, items: { type: string }, description: Platform-scope permissions }
        merchants:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              slug: { type: string }
              nameEn: { type: string }
              nameAr: { type: string }
              status: { type: string }
              logoUrl: { type: [string, 'null'] }
              permissions: { type: array, items: { type: string } }
        captain: { oneOf: [{ $ref: '#/components/schemas/CaptainProfile' }, { type: 'null' }] }
        security:
          type: object
          properties:
            mfaEnabled: { type: boolean }
            sessionMfa: { type: boolean, description: This access token was issued after a second factor }
            adminMfaRequired: { type: boolean, description: 'True when platform permissions are blocked until the user enrols in / signs in with 2FA' }
    AddressInput:
      type: object
      required: [location]
      properties:
        label: { type: string, example: home }
        location: { $ref: '#/components/schemas/LatLng' }
        area: { type: string }
        street: { type: string }
        building: { type: string }
        floor: { type: string }
        apartment: { type: string }
        landmark: { type: string }
        contactName: { type: string }
        contactPhone: { type: string }
        isDefault: { type: boolean }
    Address:
      allOf:
        - { $ref: '#/components/schemas/AddressInput' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            zoneId: { type: [string, 'null'], description: Zone covering this address, null if outside service area }
            createdAt: { type: string, format: date-time }
    FileRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, description: Public URL for public files; for private files a short-lived signed URL }
        mimeType: { type: string }
        sizeBytes: { type: integer }
    Zone:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        isActive: { type: boolean }
        boundary: { type: object, description: GeoJSON Polygon }
    ZoneInput:
      type: object
      properties:
        code: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        isActive: { type: boolean }
        boundary: { type: object, description: 'GeoJSON Polygon, coordinates [lng, lat]' }
    MerchantSummary:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        category: { $ref: '#/components/schemas/MerchantCategory' }
        logoUrl: { type: [string, 'null'] }
        coverUrl: { type: [string, 'null'] }
        brandColor: { type: string }
        accentColor: { type: string }
        taglineEn: { type: [string, 'null'] }
        taglineAr: { type: [string, 'null'] }
        ratingAvg: { type: number }
        ratingCount: { type: integer }
        isOpen: { type: boolean, description: Store toggle AND within opening hours }
        prepTimeMinutes: { type: integer }
        minOrderBaisa: { type: integer }
        acceptsCod: { type: boolean }
        acceptsOnline: { type: boolean }
        distanceM: { type: [integer, 'null'] }
        location: { $ref: '#/components/schemas/LatLng' }
    Banner:
      type: object
      properties:
        id: { type: string }
        imageUrl: { type: string }
        titleEn: { type: [string, 'null'] }
        titleAr: { type: [string, 'null'] }
        linkUrl: { type: [string, 'null'] }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    BannerInput:
      type: object
      properties:
        imageUrl: { type: string }
        titleEn: { type: string }
        titleAr: { type: string }
        linkUrl: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    Category:
      type: object
      properties:
        id: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    CategoryInput:
      type: object
      required: [nameEn, nameAr]
      properties:
        nameEn: { type: string }
        nameAr: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    ProductOption:
      type: object
      properties:
        id: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        priceDeltaBaisa: { type: integer }
        isAvailable: { type: boolean }
    OptionGroup:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [variant, addon] }
        nameEn: { type: string }
        nameAr: { type: string }
        minSelect: { type: integer }
        maxSelect: { type: integer }
        options: { type: array, items: { $ref: '#/components/schemas/ProductOption' } }
    Product:
      type: object
      properties:
        id: { type: string }
        categoryId: { type: [string, 'null'] }
        nameEn: { type: string }
        nameAr: { type: string }
        descriptionEn: { type: [string, 'null'] }
