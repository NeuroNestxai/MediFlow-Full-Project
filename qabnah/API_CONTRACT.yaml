openapi: 3.1.0
info:
  title: Qabnah API
  version: 1.0.0
  description: |
    REST API for the Qabnah delivery & e-commerce platform (Muscat, Oman).

    Conventions
    - Base path `/v1`. JSON, camelCase. Times are ISO-8601 UTC.
    - **Money is integer baisa** (1 OMR = 1000 baisa), fields end in `Baisa`. Currency is always `OMR`.
    - Locations are `{lat, lng}` (WGS-84).
    - Auth: `Authorization: Bearer <accessToken>` (JWT, 15 min). Refresh with `/auth/refresh`.
    - Errors: `{ "error": { "code": "string", "message": "string", "details": {} } }` with HTTP 400/401/403/404/409/422/429/500.
    - Admin MFA: when the server runs with REQUIRE_ADMIN_MFA=true (mandatory in production), every platform-permission
      endpoint returns 403 `mfa_enrollment_required` (no TOTP yet) or `mfa_required` (signed in without the second factor).
      Common codes: `validation_error`, `unauthorized`, `forbidden`, `not_found`, `conflict`,
      `invalid_transition`, `out_of_service_area`, `merchant_closed`, `rate_limited`.
    - Lists: `?limit=` (default 20, max 100) and `?offset=`; response `{items, total, limit, offset}`.
    - Mutating order endpoints accept `Idempotency-Key` header.

    Realtime (WebSocket) — `GET /v1/realtime?token=<accessToken>`
    - Client → server: `{"type":"subscribe","channel":"order:<id>"}`, `{"type":"unsubscribe","channel":"…"}`,
      `{"type":"location","lat":23.6,"lng":58.4,"heading":90,"speed":8.2,"accuracy":5}` (captains), `{"type":"ping"}`.
    - Server → client: `{"type":"subscribed","channel":"…"}`, `{"type":"error","code":"forbidden","channel":"…"}`,
      `{"type":"event","channel":"order:<id>","event":"order.status_changed","data":{…},"id":123}`, `{"type":"pong"}`.
    - Channels: `order:<id>` (customer, merchant staff, assigned captain, ops), `delivery:<id>`,
      `merchant:<id>` (staff with merchant.orders:read), `captain:me` (offers, assignment changes),
      `user:me` (notifications), `admin:ops` (deliveries:read).
    - Events: `order.created`, `order.status_changed`, `delivery.status_changed`, `delivery.assigned`,
      `delivery.location` ({lat,lng,heading,etaDropoffAt}), `offer.created`, `offer.expired`, `offer.cancelled`,
      `notification.created`, `captain.location` (admin:ops only).
    - Event `data` payloads:
      `order.created` {orderId, number, totalBaisa?};
      `order.status_changed` {orderId, number, from, to, at};
      `delivery.status_changed` {deliveryId, orderId, from, to, captainId};
      `delivery.assigned` {deliveryId, orderId, captainId, etaPickupAt};
      `delivery.unassigned` {deliveryId} (captain:me, after an ops reassignment);
      `delivery.location` {deliveryId, orderId, lat, lng, heading, etaPickupAt, etaDropoffAt};
      `offer.created` = the `Offer` schema; `offer.expired` / `offer.cancelled` {offerId, deliveryId};
      `notification.created` {id, type, title, body, data, createdAt};
      `captain.location` {captainId, lat, lng, activeDeliveries}.

    Push notifications (APNs for iOS, FCM for Android) carry: title, body and a data map
      {type, orderId?, deliveryId?, offerId?, ticketId?, number?}. `type` matches in-app notification types:
      order.placed.merchant, order.accepted, order.rejected, order.cancelled, delivery.assigned, delivery.picked_up,
      delivery.delivered, delivery.failed, offer.created, captain.approved, captain.rejected, captain.document_rejected,
      captain.document_expiring, merchant.approved, merchant.rejected, support.reply, payment_link.paid.
      Deep links: qabnah://order/<orderId>, qabnah://offer/<offerId>, qabnah://delivery/<deliveryId>, qabnah://ticket/<ticketId>.

    Specific error codes clients should handle
    - `wrong_pin`, `proof_required`, `cod_mismatch` (422, delivery completion); `offer_taken` vs `offer_expired` (409, offer accept);
      `invalid_code`, `too_many_attempts` (401, OTP); `merchant_closed`, `below_minimum`, `invalid_options`, `out_of_stock`,
      `item_unavailable`, `out_of_service_area`, `cod_limit`, `payment_method_unavailable` (422, ordering); `not_cancellable` (409);
      `documents_incomplete`, `fleet_required` (409, captain approval); `slug_taken`, `email_taken`, `phone_taken` (409, sign-up).
    - `Order.paymentStatus`: unpaid | pending | paid | failed | refunded | partially_refunded.
    - `returnUrl` for checkout may be a custom scheme (e.g. `qabnah://payment-return`); the server appends `paymentId` and `outcome`.
servers:
  - url: http://localhost:4000/v1
    description: Local development (docker compose)
tags:
  - name: Health
  - name: Auth
  - name: Me
  - name: Public
  - name: Consumer
  - name: Captain
  - name: Merchant
  - name: Admin
  - name: Webhooks
security:
  - bearer: []

paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Liveness
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok } } } } } }
  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Readiness (database reachable)
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }

  # ─────────────── Auth ───────────────
  /auth/otp/request:
    post:
      tags: [Auth]
      security: []
      summary: Send a login OTP by SMS (consumers and captains)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: 'Omani mobile in E.164, e.g. +96891234567', example: '+96891234567' }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  expiresInSeconds: { type: integer }
                  devCode: { type: string, description: 'Only present when the server runs with OTP_DEV_ECHO=true (never in production).' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      security: []
      summary: Verify OTP and sign in (creates the user on first login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, example: '123456' }
                fullName: { type: string, description: Used on first sign-up }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Email/password sign-in (merchant staff and platform staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/mfa/verify:
    post:
      tags: [Auth]
      security: []
      summary: Second sign-in step. /auth/login returns {mfaRequired:true, mfaToken} (valid 5 min) for accounts with TOTP; exchange it here with a 6-digit authenticator code or a one-time recovery code.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [mfaToken], properties: { mfaToken: { type: string }, code: { type: string }, recoveryCode: { type: string } } } } }
      responses:
        '200': { description: Signed in (tokens carry the MFA claim, kept across refreshes), content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Start TOTP enrolment (e-mail/password accounts). Returns the base32 secret and an otpauth:// URL for a QR code.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { secret: { type: string }, otpauthUrl: { type: string } } } } } }
        '409': { $ref: '#/components/responses/Error' }
  /auth/mfa/enable:
    post:
      tags: [Auth]
      summary: Confirm enrolment with a current code. Returns 10 one-time recovery codes (shown once) and fresh MFA tokens; other sessions are revoked.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        '200': { description: Enabled, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Tokens' }, { type: object, properties: { recoveryCodes: { type: array, items: { type: string } } } }] } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/mfa/disable:
    post:
      tags: [Auth]
      summary: Turn TOTP off (requires a current code). Refused for platform staff when REQUIRE_ADMIN_MFA is on (409 mfa_required_for_staff).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses: { '200': { description: Disabled }, '409': { $ref: '#/components/responses/Error' } }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Rotate refresh token
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } }
      responses:
        '200': { description: New tokens, content: { application/json: { schema: { $ref: '#/components/schemas/Tokens' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      requestBody:
        content: { application/json: { schema: { type: object, properties: { refreshToken: { type: string } } } } }
      responses:
        '204': { description: Revoked }
  /merchants/register:
    post:
      tags: [Auth]
      security: []
      summary: Merchant self sign-up (creates owner account + merchant in pending_review)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName, merchant]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                fullName: { type: string }
                phone: { type: string }
                merchant:
                  type: object
                  required: [nameEn, nameAr, slug, category, location]
                  properties:
                    nameEn: { type: string }
                    nameAr: { type: string }
                    slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$' }
                    category: { $ref: '#/components/schemas/MerchantCategory' }
                    location: { $ref: '#/components/schemas/LatLng' }
                    addressText: { type: string }
                    crNumber: { type: string }
                    contactPhone: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '409': { $ref: '#/components/responses/Error' }

  # ─────────────── Me ───────────────
  /me:
    get:
      tags: [Me]
      summary: Current user, roles, permissions, merchant memberships, captain profile
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
    patch:
      tags: [Me]
      summary: Update profile
      requestBody:
        content: { application/json: { schema: { type: object, properties: { fullName: { type: string }, locale: { type: string, enum: [ar, en] }, email: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
  /me/export:
    get:
      tags: [Me]
      summary: 'Personal data export (PDPL access right): profile, addresses, orders, tickets, notifications, captain profile and documents metadata. JSON download.'
      responses:
        '200': { description: JSON export, content: { application/json: { schema: { type: object } } } }
  /me/delete:
    post:
      tags: [Me]
      summary: 'Delete my account (PDPL erasure). Refused with 409 while orders/deliveries are active or a balance is unsettled. Personal data is anonymised; financial/tax records keep only non-identifying data.'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { type: string, enum: [DELETE] } } } } }
      responses:
        '204': { description: Account deleted and all sessions revoked }
        '409': { $ref: '#/components/responses/Error' }
  /me/addresses:
    get:
      tags: [Me]
      summary: List saved addresses
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Address' } } } } } } }
    post:
      tags: [Me]
      summary: Add address
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
  /me/addresses/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    patch:
      tags: [Me]
      summary: Update address
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Address' } } } }
    delete:
      tags: [Me]
      summary: Delete address
      responses: { '204': { description: Deleted } }
  /me/notifications:
    get:
      tags: [Me]
      summary: In-app notifications
      parameters: [{ $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/offset' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } }
  /me/notifications/{id}/read:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Me]
      summary: Mark notification read
      responses: { '204': { description: OK } }
  /me/devices:
    post:
      tags: [Me]
      summary: Register a push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, app, token]
              properties:
                platform: { type: string, enum: [ios, android, web] }
                app: { type: string, enum: [consumer, captain, merchant, admin] }
                token: { type: string }
      responses: { '204': { description: Registered } }
  /me/devices/unregister:
    post:
      tags: [Me]
      summary: Remove a push token (call on sign-out)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses: { '204': { description: Removed } }
  /files:
    post:
      tags: [Me]
      summary: Upload a file (multipart/form-data, field `file`, plus `purpose`)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: { type: string, format: binary }
                purpose: { type: string, enum: [captain_document, merchant_document, product_image, branding, proof_of_delivery, support_attachment, other] }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/FileRef' } } } }
  /files/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Me]
      summary: Download a file. Public files need no auth; private files need auth (owner or reviewer) or a signed `?sig=&exp=` query.
      security: []
      responses: { '200': { description: File bytes }, '403': { $ref: '#/components/responses/Error' } }

  # ─────────────── Public ───────────────
  /zones:
    get:
      tags: [Public]
      security: []
      summary: Active service zones (GeoJSON boundaries)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Zone' } } } } } } }
  /stores:
    get:
      tags: [Public]
      security: []
      summary: Browse active stores, optionally near a location
      parameters:
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/MerchantCategory' } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MerchantSummary' } }, total: { type: integer } } } } } }
  /merchants/slug-availability:
    get:
      tags: [Public]
      security: []
      summary: Check whether a storefront slug is valid and free (includes stores pending review)
      parameters: [{ name: slug, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { slug: { type: string }, valid: { type: boolean }, available: { type: boolean } } } } } }
  /stores/{slug}:
    parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Public]
      security: []
      summary: Branded storefront (profile, banners, categories with products, variants and add-ons)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Storefront' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /quotes/delivery:
    post:
      tags: [Public]
      security: []
      summary: Quote a delivery fee and ETA between two points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, pickup, dropoff]
              properties:
                type: { $ref: '#/components/schemas/OrderType' }
                pickup: { $ref: '#/components/schemas/LatLng' }
                dropoff: { $ref: '#/components/schemas/LatLng' }
                vehicleType: { $ref: '#/components/schemas/VehicleType' }
                packageSize: { type: string, enum: [small, medium, large], description: 'C2C: large parcels are priced for a car, as when the shipment is created' }
      responses:
        '200': { description: Quote, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryQuote' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /pay/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Public]
      security: []
      summary: Payment link details for the public pay page
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPaymentLink' } } } }
  /pay/{code}/checkout:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Public]
      security: []
      summary: Start checkout for a payment link (optionally with a dropoff for delivery)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customerName: { type: string }
                customerPhone: { type: string }
                dropoff: { $ref: '#/components/schemas/PlaceInput' }
      responses:
        '200': { description: Checkout created, content: { application/json: { schema: { $ref: '#/components/schemas/Checkout' } } } }
  /invoices/{orderId}:
    parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Public]
      security: []
      summary: Bilingual (Arabic/English) receipt / simplified tax invoice page. Requires the signed exp/sig query from Order.invoiceUrl.
      parameters: [{ name: exp, in: query, required: true, schema: { type: integer } }, { name: sig, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: HTML page }, '403': { description: Link expired or invalid } }
  /mock-pay/{paymentId}:
    parameters: [{ name: paymentId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Public]
      security: []
      summary: Development-only hosted page for the mock payment provider (HTML)
      responses: { '200': { description: HTML page } }
  /mock-pay/{paymentId}/complete:
    parameters: [{ name: paymentId, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Public]
      security: []
      summary: Development-only — simulate gateway result (`outcome=paid|failed`)
      requestBody:
        content: { application/json: { schema: { type: object, properties: { outcome: { type: string, enum: [paid, failed] } } } } }
      responses: { '200': { description: Result applied } }

  /payments/{paymentId}:
    parameters: [{ name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Public]
      security: []
      summary: Payment status (re-confirmed with the provider). Used by the pay page and apps after returning from the gateway.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { paymentId: { type: string }, status: { type: string }, amountBaisa: { type: integer }, orderId: { type: [string, 'null'] } } } } } }
  /payments/return:
    get:
      tags: [Public]
      security: []
      summary: Default gateway return page (HTML) telling the user to go back to the app
      parameters:
        - { name: paymentId, in: query, required: true, schema: { type: string } }
        - { name: outcome, in: query, required: true, schema: { type: string, enum: [success, cancel] } }
      responses: { '200': { description: HTML page } }

  # ─────────────── Consumer ───────────────
  /orders/quote:
    post:
      tags: [Consumer]
      summary: Price a marketplace cart (validates options, stock, store open, service area)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceOrderInput' } } } }
      responses:
        '200': { description: Price breakdown, content: { application/json: { schema: { $ref: '#/components/schemas/PriceBreakdown' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /orders:
    get:
      tags: [Consumer]
      summary: My orders (all types), newest first
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, past] } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } }
    post:
      tags: [Consumer]
      summary: Place a marketplace (B2C) order
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceOrderInput' } } } }
      responses:
        '201': { description: 'Created. If paymentMethod=online the order is pending_payment; call /orders/{id}/checkout.', content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /shipments:
    post:
      tags: [Consumer]
      summary: Create a C2C shipment (send a parcel)
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup, dropoff, package, paymentMethod]
              properties:
                pickup: { $ref: '#/components/schemas/PlaceInput' }
                dropoff: { $ref: '#/components/schemas/PlaceInput' }
                package:
                  type: object
                  required: [size, description]
                  properties:
                    size: { type: string, enum: [small, medium, large] }
                    description: { type: string }
                    declaredValueBaisa: { type: integer }
                vehicleType: { $ref: '#/components/schemas/VehicleType' }
                paymentMethod: { type: string, enum: [online, cod] }
                codPayer: { type: string, enum: [sender, recipient], description: Required when paymentMethod=cod }
                notes: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
  /orders/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Consumer]
      summary: Order detail (customer, merchant staff of that merchant, assigned captain, or ops)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
  /orders/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Consumer]
      summary: Cancel my order (allowed before the merchant accepts / before pickup for C2C)
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } } }
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /orders/{id}/checkout:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Consumer]
      summary: Create an online payment checkout for an order in pending_payment
      requestBody:
        content: { application/json: { schema: { type: object, properties: { returnUrl: { type: string } } } } }
      responses:
        '200': { description: Checkout, content: { application/json: { schema: { $ref: '#/components/schemas/Checkout' } } } }
  /orders/{id}/tracking:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Consumer]
      summary: Live tracking snapshot (polling fallback for the WebSocket)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Tracking' } } } }
  /orders/{id}/rating:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Consumer]
      summary: Rate the captain and/or merchant of a delivered order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                captain: { type: object, properties: { score: { type: integer, minimum: 1, maximum: 5 }, comment: { type: string } } }
                merchant: { type: object, properties: { score: { type: integer, minimum: 1, maximum: 5 }, comment: { type: string } } }
      responses: { '204': { description: Saved } }
  /support/tickets:
    get:
      tags: [Consumer]
      summary: My support tickets
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Ticket' } } } } } } }
    post:
      tags: [Consumer]
      summary: Open a support ticket (consumer, captain or merchant staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, category, message]
              properties:
                subject: { type: string }
                category: { type: string, enum: [order_issue, payment, delivery, captain, merchant, account, other] }
                orderId: { type: string, format: uuid }
                message: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
  /support/tickets/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Consumer]
      summary: Ticket with messages (internal notes hidden from requester)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
  /support/tickets/{id}/messages:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Consumer]
      summary: Reply on a ticket (requester or support staff; staff may set isInternal)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string }, isInternal: { type: boolean } } } } }
      responses:
        '201': { description: Created }

  # ─────────────── Captain ───────────────
  /captain/register:
    post:
      tags: [Captain]
      summary: Create my captain profile (status pending_documents)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainProfileInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainProfile' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /captain/profile:
    get:
      tags: [Captain]
      summary: My captain profile incl. documents, zones, availability, onboarding checklist
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainProfile' } } } }
    patch:
      tags: [Captain]
      summary: Update vehicle / payout details (vehicle changes on an active captain move it back to pending_review)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainProfileInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainProfile' } } } }
  /captain/documents:
    post:
      tags: [Captain]
      summary: Attach an uploaded file as a verification document. When all required documents are uploaded, status moves to pending_review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docType, fileId]
              properties:
                docType: { $ref: '#/components/schemas/CaptainDocType' }
                fileId: { type: string, format: uuid }
                number: { type: string }
                expiresAt: { type: string, format: date }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainDocument' } } } }
  /captain/zones:
    put:
      tags: [Captain]
      summary: Replace my service zones
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [zoneIds], properties: { zoneIds: { type: array, items: { type: string, format: uuid } } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainProfile' } } } } }
  /captain/availability:
    put:
      tags: [Captain]
      summary: Replace my weekly availability (local Muscat time)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots: { type: array, items: { $ref: '#/components/schemas/AvailabilitySlot' } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainProfile' } } } } }
  /captain/status:
    post:
      tags: [Captain]
      summary: Go online/offline (only active captains may go online; a location is required to go online)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [online]
              properties:
                online: { type: boolean }
                location: { $ref: '#/components/schemas/LatLng' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainProfile' } } } } }
  /captain/location:
    post:
      tags: [Captain]
      summary: Report location (REST fallback for the WebSocket `location` message)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocationPing' } } } }
      responses: { '204': { description: Stored } }
  /captain/offers:
    get:
      tags: [Captain]
      summary: My pending offers
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Offer' } } } } } } }
  /captain/offers/{id}/accept:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Captain]
      summary: Accept an offer (409 if expired or taken)
      responses:
        '200': { description: Assigned, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainDelivery' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /captain/offers/{id}/reject:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Captain]
      summary: Reject an offer
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } } }
      responses: { '204': { description: Rejected } }
  /captain/deliveries:
    get:
      tags: [Captain]
      summary: My deliveries
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, history] } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/CaptainDelivery' } }, total: { type: integer } } } } } }
  /captain/deliveries/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [Captain]
      summary: Delivery detail (assigned captain only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainDelivery' } } } }
  /captain/deliveries/{id}/status:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Captain]
      summary: Advance the delivery (arrived at pickup, picked up, arrived at dropoff, failed, release before pickup)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [arrive_pickup, pickup, arrive_dropoff, fail, release] }
                reason: { type: string, description: Required for fail and release }
                location: { $ref: '#/components/schemas/LatLng' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainDelivery' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /captain/deliveries/{id}/complete:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [Captain]
      summary: Complete with proof of delivery (PIN from recipient when pinRequired; photo optional unless PIN missing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string, example: '4821' }
                photoFileId: { type: string, format: uuid }
                recipientName: { type: string }
                codCollectedBaisa: { type: integer }
                note: { type: string }
                location: { $ref: '#/components/schemas/LatLng' }
      responses:
        '200': { description: Delivered, content: { application/json: { schema: { $ref: '#/components/schemas/CaptainDelivery' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /captain/earnings:
    get:
      tags: [Captain]
      summary: Earnings summary and ledger for a period
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Earnings' } } } }
  /captain/payouts:
    get:
      tags: [Captain]
      summary: My settlements / payouts
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Settlement' } } } } } } }

  # ─────────────── Merchant portal ───────────────
  /merchants/{merchantId}:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    get:
      tags: [Merchant]
      summary: Store profile and settings (merchant.store:read)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantDetail' } } } }
    patch:
      tags: [Merchant]
      summary: Update profile, branding, hours, operating and WhatsApp settings (merchant.store:manage)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantDetail' } } } }
  /merchants/{merchantId}/banners:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    get:
      tags: [Merchant]
      summary: List banners
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Banner' } } } } } } } }
    post:
      tags: [Merchant]
      summary: Add banner
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BannerInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Banner' } } } } }
  /merchants/{merchantId}/banners/{id}:
    parameters: [{ $ref: '#/components/parameters/merchantId' }, { $ref: '#/components/parameters/id' }]
    patch:
      tags: [Merchant]
      summary: Update banner
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BannerInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Banner' } } } } }
    delete:
      tags: [Merchant]
      summary: Delete banner
      responses: { '204': { description: Deleted } }
  /merchants/{merchantId}/categories:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    get:
      tags: [Merchant]
      summary: List categories
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } } }
    post:
      tags: [Merchant]
      summary: Create category (merchant.catalog:write)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } } }
  /merchants/{merchantId}/categories/{id}:
    parameters: [{ $ref: '#/components/parameters/merchantId' }, { $ref: '#/components/parameters/id' }]
    patch:
      tags: [Merchant]
      summary: Update category
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } } }
    delete:
      tags: [Merchant]
      summary: Delete category (products become uncategorised)
      responses: { '204': { description: Deleted } }
  /merchants/{merchantId}/products:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    get:
      tags: [Merchant]
      summary: List products with option groups
      parameters: [{ name: categoryId, in: query, schema: { type: string } }, { name: q, in: query, schema: { type: string } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Product' } } } } } } } }
    post:
      tags: [Merchant]
      summary: Create product with variants and add-ons
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } } }
  /merchants/{merchantId}/products/{id}:
    parameters: [{ $ref: '#/components/parameters/merchantId' }, { $ref: '#/components/parameters/id' }]
    get:
      tags: [Merchant]
      summary: Product
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } } }
    put:
      tags: [Merchant]
      summary: Replace product (option groups are replaced as a whole)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } } }
    patch:
      tags: [Merchant]
      summary: Partial update (e.g. toggle isAvailable, stockQty)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { isAvailable: { type: boolean }, stockQty: { type: integer }, basePriceBaisa: { type: integer } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } } }
    delete:
      tags: [Merchant]
      summary: Delete product
      responses: { '204': { description: Deleted } }
  /merchants/{merchantId}/orders:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    get:
      tags: [Merchant]
      summary: Store orders (merchant.orders:read)
      parameters:
        - { name: status, in: query, description: 'Comma-separated statuses, or `active`', schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/OrderType' } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } } }
  /merchants/{merchantId}/orders/{id}:
    parameters: [{ $ref: '#/components/parameters/merchantId' }, { $ref: '#/components/parameters/id' }]
    get:
      tags: [Merchant]
      summary: Store order detail (merchant.orders:read; 403 if the order belongs to another store)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } } }
  /merchants/{merchantId}/orders/{id}/{action}:
    parameters:
      - { $ref: '#/components/parameters/merchantId' }
      - { $ref: '#/components/parameters/id' }
      - { name: action, in: path, required: true, schema: { type: string, enum: [accept, reject, preparing, ready, cancel] } }
    post:
      tags: [Merchant]
      summary: Process an order (merchant.orders:process). accept takes prepTimeMinutes; reject/cancel take reason.
      requestBody: { content: { application/json: { schema: { type: object, properties: { prepTimeMinutes: { type: integer }, reason: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /merchants/{merchantId}/deliveries:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    post:
      tags: [Merchant]
      summary: Book a merchant-initiated delivery (e.g. an Instagram/WhatsApp sale). Pickup defaults to the store.
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dropoff]
              properties:
                dropoff: { $ref: '#/components/schemas/PlaceInput' }
                pickup: { $ref: '#/components/schemas/PlaceInput' }
                codAmountBaisa: { type: integer, minimum: 0, description: Cash the captain collects from the customer for the merchant }
                packageDescription: { type: string }
                packageSize: { type: string, enum: [small, medium, large] }
                vehicleType: { $ref: '#/components/schemas/VehicleType' }
                notes: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
  /merchants/{merchantId}/payment-links:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    get:
      tags: [Merchant]
      summary: List payment links
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/PaymentLink' } } } } } } } }
    post:
      tags: [Merchant]
      summary: Create a payment link (merchant.payment_links:manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, amountBaisa]
              properties:
                title: { type: string }
                description: { type: string }
                amountBaisa: { type: integer, minimum: 100 }
                customerName: { type: string }
                customerPhone: { type: string }
                requestDelivery: { type: boolean }
                expiresInHours: { type: integer, default: 72 }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentLink' } } } } }
  /merchants/{merchantId}/payment-links/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/merchantId' }, { $ref: '#/components/parameters/id' }]
    post:
      tags: [Merchant]
      summary: Cancel an unpaid link
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentLink' } } } } }
  /merchants/{merchantId}/staff:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    get:
      tags: [Merchant]
      summary: List store staff
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/StaffMember' } } } } } } } }
    post:
      tags: [Merchant]
      summary: Add staff (creates account with a temporary password returned once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName, role]
              properties:
                email: { type: string }
                fullName: { type: string }
                role: { type: string, enum: [merchant_manager, merchant_staff] }
      responses: { '201': { description: Created, content: { application/json: { schema: { type: object, properties: { member: { $ref: '#/components/schemas/StaffMember' }, temporaryPassword: { type: string } } } } } } }
  /merchants/{merchantId}/staff/{userId}:
    parameters: [{ $ref: '#/components/parameters/merchantId' }, { name: userId, in: path, required: true, schema: { type: string } }]
    delete:
      tags: [Merchant]
      summary: Remove staff member's roles for this store
      responses: { '204': { description: Removed } }
  /merchants/{merchantId}/documents:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    get:
      tags: [Merchant]
      summary: KYB documents
      responses: { '200': { description: OK } }
    post:
      tags: [Merchant]
      summary: Attach an uploaded KYB document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docType, fileId]
              properties:
                docType: { type: string, enum: [commercial_registration, vat_certificate, municipality_license, owner_id, bank_letter, other] }
                fileId: { type: string, format: uuid }
                number: { type: string }
                expiresAt: { type: string, format: date }
      responses: { '201': { description: Created } }
  /merchants/{merchantId}/whatsapp/messages:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    get:
      tags: [Merchant]
      summary: WhatsApp message log for this store
      responses: { '200': { description: OK } }
  /merchants/{merchantId}/whatsapp/test:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    post:
      tags: [Merchant]
      summary: Send a test WhatsApp template message to a phone
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone], properties: { phone: { type: string } } } } } }
      responses: { '200': { description: Sent (or logged by the console provider) } }
  /merchants/{merchantId}/finance:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    get:
      tags: [Merchant]
      summary: Balance, unsettled entries and settlements (merchant.finance:read)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AccountFinance' } } } } }
  /merchants/{merchantId}/analytics:
    parameters: [{ $ref: '#/components/parameters/merchantId' }]
    get:
      tags: [Merchant]
      summary: Store KPIs for a period
      parameters: [{ name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Analytics' } } } } }

  # ─────────────── Admin ───────────────
  /admin/merchants:
    get:
      tags: [Admin]
      summary: Merchants (merchants:read)
