name: Qabnah mobile screenshots

# Runs the Android apps on an emulator against the real backend and commits screenshots to the branch.
on:
  workflow_dispatch:
  push:
    paths:
      - 'qabnah/mobile/**'
      - '.github/workflows/qabnah-mobile-screens.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # one run per platform at a time; a newer push replaces it (the publish step keeps the previous pictures if it has none)
    concurrency: { group: 'qabnah-screens-android-${{ github.ref }}', cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 30 }

      - name: Start backend stack (PostGIS, API, worker, merchant web for product photos)
        working-directory: qabnah/infra
        run: |
          cp .env.example .env
          sed -i 's#^MERCHANT_WEB_URL=.*#MERCHANT_WEB_URL=http://10.0.2.2:5173#' .env
          docker compose up -d --build db migrate seed api worker merchant-web
          for i in $(seq 1 60); do curl -fsS localhost:4000/v1/health/ready && break; sleep 3; done
          curl -fsS localhost:4000/v1/stores | head -c 400

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs
        working-directory: qabnah/mobile/android
        run: ./gradlew :consumer:assembleDebug :captain:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run apps on the emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 qabnah/mobile/screens/android_screens.py "$RUNNER_TEMP/shots" qabnah/mobile/android/consumer/build/outputs/apk/debug/consumer-debug.apk qabnah/mobile/android/captain/build/outputs/apk/debug/captain-debug.apk

      - name: Backend logs (for debugging failed steps)
        if: always()
        working-directory: qabnah/infra
        run: docker compose logs --tail 60 api | tail -80

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-screenshots, path: '${{ runner.temp }}/shots', if-no-files-found: warn }

      - name: Publish screenshots to the branch
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import os, pathlib
          from PIL import Image
          src = pathlib.Path(os.environ["RUNNER_TEMP"]) / "shots"
          dst = pathlib.Path("qabnah/docs/screenshots/mobile/android")
          dst.mkdir(parents=True, exist_ok=True)
          pngs = sorted(src.glob("*.png"))
          if pngs:  # a cancelled or failed run must not wipe the previous pictures
              for old in dst.glob("*.jpg"): old.unlink()
          for png in pngs:
              im = Image.open(png).convert("RGB")
              im = im.resize((720, round(im.height * 720 / im.width)), Image.LANCZOS)
              im.save(dst / (png.stem + ".jpg"), quality=86)
          print(len(list(dst.glob("*.jpg"))), "screenshots")
          log = src / "run.log"
          if log.exists(): (dst / "run-log.txt").write_text(log.read_text(encoding="utf-8", errors="replace"), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A qabnah/docs/screenshots/mobile/android
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -m "Android emulator screenshots (run ${{ github.run_number }}) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break; sleep 5; done

  # iOS: UI tests (QabnahScreens target) drive both apps on an iPhone simulator against a backend started on the runner.
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    concurrency: { group: 'qabnah-screens-ios-${{ github.ref }}', cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 30 }
      - name: Skip when the UI test target is not in the project yet
        id: have
        run: test -d qabnah/mobile/ios/QabnahScreens && echo "tests=yes" >> "$GITHUB_OUTPUT" || echo "tests=no" >> "$GITHUB_OUTPUT"

      - name: PostgreSQL + PostGIS
        if: steps.have.outputs.tests == 'yes'
        run: |
          # Homebrew's postgis bottle carries builds for postgresql@17 and @18 but installs neither server.
          brew install postgresql@17 postgis
          PGBIN="$(brew --prefix postgresql@17)/bin"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust > /dev/null
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-p 5432" -w start
          "$PGBIN/createdb" -h localhost -U postgres qabnah
          "$PGBIN/psql" -h localhost -U postgres -d qabnah -c "CREATE EXTENSION IF NOT EXISTS postgis; SELECT postgis_version();"

      - uses: actions/setup-node@v4
        if: steps.have.outputs.tests == 'yes'
        with: { node-version: 22 }
      - name: Backend with sample data (API :4000) and product photos (:5173)
        if: steps.have.outputs.tests == 'yes'
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/qabnah
          OTP_DEV_ECHO: 'true'
          RUN_WORKER_IN_PROCESS: 'true'
          MERCHANT_WEB_URL: http://localhost:5173
          PUBLIC_API_URL: http://localhost:4000
          LOG_LEVEL: warn
        run: |
          cd qabnah/backend
          npm ci
          npx tsx src/scripts/seed.ts
          nohup npx tsx src/server.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd ../apps/merchant/public && nohup python3 -m http.server 5173 > /dev/null 2>&1 &)
          for i in $(seq 1 40); do curl -fsS localhost:4000/v1/health/ready && break; sleep 2; done
          curl -fsS localhost:4000/v1/stores | head -c 300

      - name: Generate project
        if: steps.have.outputs.tests == 'yes'
        working-directory: qabnah/mobile/ios
        run: brew install xcodegen && xcodegen generate

      - name: Run the screenshot UI tests on an iPhone simulator
        if: steps.have.outputs.tests == 'yes'
        working-directory: qabnah/mobile/ios
        env:
          QABNAH_SHOTS_DIR: ${{ runner.temp }}/shots
        run: |
          mkdir -p "$QABNAH_SHOTS_DIR"
          DEVICE=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]( Pro)? \(' | head -1 | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          echo "simulator: $DEVICE"
          set -o pipefail
          # TEST_RUNNER_ prefixed variables are passed into the UI test runner process
          TEST_RUNNER_QABNAH_SHOTS_DIR="$QABNAH_SHOTS_DIR" xcodebuild test -project Qabnah.xcodeproj -scheme QabnahScreens \
            -destination "platform=iOS Simulator,name=$DEVICE" -resultBundlePath "$RUNNER_TEMP/screens.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "Test Case|error:|\*\* TEST|shot:|missing:|failed|Executed" | tail -200 | tee "$QABNAH_SHOTS_DIR/run.log" || true
          ls -la "$QABNAH_SHOTS_DIR" | head -60

      - name: Backend log
        if: always() && steps.have.outputs.tests == 'yes'
        run: tail -40 "$RUNNER_TEMP/api.log" || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.have.outputs.tests == 'yes'
        with: { name: ios-screenshots, path: '${{ runner.temp }}/shots', if-no-files-found: warn }

      - name: Publish screenshots to the branch
        if: always() && steps.have.outputs.tests == 'yes'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os, pathlib
          from PIL import Image
          src = pathlib.Path(os.environ["RUNNER_TEMP"]) / "shots"
          dst = pathlib.Path("qabnah/docs/screenshots/mobile/ios")
          dst.mkdir(parents=True, exist_ok=True)
          pngs = sorted(src.glob("*.png"))
          if pngs:
              for old in dst.glob("*.jpg"): old.unlink()
          for png in pngs:
              im = Image.open(png).convert("RGB")
              im = im.resize((720, round(im.height * 720 / im.width)), Image.LANCZOS)
              im.save(dst / (png.stem + ".jpg"), quality=86)
          print(len(pngs), "screenshots")
          log = src / "run.log"
          if log.exists(): (dst / "run-log.txt").write_text(log.read_text(encoding="utf-8", errors="replace"), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A qabnah/docs/screenshots/mobile/ios
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -m "iOS simulator screenshots (run ${{ github.run_number }}) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break; sleep 5; done
