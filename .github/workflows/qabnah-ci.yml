name: Qabnah CI

on:
  push:
    paths: ['qabnah/**', '.github/workflows/qabnah-ci.yml']
  pull_request:
    paths: ['qabnah/**', '.github/workflows/qabnah-ci.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: qabnah/backend } }
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: qabnah/backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env: { TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/qabnah_test }
      - run: npm run build
      - run: docker build -t qabnah/backend:ci .

  android:
    runs-on: ubuntu-latest   # hosted runner ships the Android SDK (ANDROID_HOME), so the app modules are included
    defaults: { run: { working-directory: qabnah/mobile/android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test --no-daemon
      - run: ./gradlew :consumer:assembleDebug :captain:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: qabnah-android-debug-apks
          path: qabnah/mobile/android/*/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: qabnah/mobile/ios } }
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: swift test --package-path QabnahKit
      - run: xcodegen generate
      - name: Build consumer app (simulator, unsigned)
        run: xcodebuild -project Qabnah.xcodeproj -scheme QabnahConsumer -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
        shell: bash -o pipefail {0}
      - name: Build captain app (simulator, unsigned)
        run: xcodebuild -project Qabnah.xcodeproj -scheme QabnahCaptain -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
        shell: bash -o pipefail {0}
